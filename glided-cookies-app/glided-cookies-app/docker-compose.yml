version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creme_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      JWT_SECRET: creme_crumbs_jwt_secret_devops_2024
      PORT: 5000
      FRONTEND_URL: http://localhost:80
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creme_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
